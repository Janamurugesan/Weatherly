
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weatherly - Weather Forecast</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #101d3a, #243b65, #426b91);
    color: white;
    padding: 35px 15px;
}

.container {
    max-width: 1050px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 45px;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #8bd8ff;
}

.logo span {
    color: white;
}

.location-btn {
    padding: 12px 20px;
    border: 1px solid #8bd8ff;
    background: transparent;
    color: white;
    border-radius: 25px;
    cursor: pointer;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #c5d7ed;
    margin-bottom: 30px;
}

.search-box {
    display: flex;
    max-width: 550px;
    margin: auto auto 35px;
    background: white;
    padding: 7px;
    border-radius: 35px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 12px 18px;
    font-size: 16px;
    border-radius: 30px;
}

.search-box button {
    background: #168bd2;
    border: none;
    color: white;
    padding: 12px 25px;
    border-radius: 30px;
    cursor: pointer;
}

.search-box button:hover {
    background: #0871b5;
}

.weather-card {
    display: none;
    background: rgba(255,255,255,0.13);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.weather-main {
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
    text-align: center;
    padding: 20px 0;
}

.city {
    font-size: 27px;
    font-weight: bold;
}

.temperature {
    font-size: 65px;
    font-weight: bold;
    margin: 10px 0;
}

.weather-icon {
    font-size: 85px;
}

.description {
    font-size: 19px;
    color: #d4e9ff;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.detail-box {
    background: rgba(255,255,255,0.12);
    border-radius: 15px;
    padding: 22px 10px;
    text-align: center;
}

.detail-box h3 {
    font-size: 15px;
    color: #c5ddf5;
    margin-bottom: 10px;
}

.detail-box p {
    font-size: 21px;
    font-weight: bold;
}

.forecast-title {
    margin-top: 35px;
    margin-bottom: 20px;
    font-size: 24px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.forecast-day {
    text-align: center;
    background: rgba(255,255,255,0.12);
    padding: 20px 8px;
    border-radius: 15px;
}

.forecast-day .icon {
    font-size: 35px;
    margin: 12px 0;
}

.forecast-day p {
    font-size: 14px;
    margin: 7px 0;
}

.message {
    text-align: center;
    margin: 20px;
    color: #ffdb9d;
}

footer {
    text-align: center;
    margin-top: 35px;
    color: #c5d7ed;
    font-size: 13px;
}

@media(max-width:600px) {
    h1 {
        font-size: 29px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .forecast {
        grid-template-columns: repeat(2, 1fr);
    }

    .temperature {
        font-size: 50px;
    }

    header {
        justify-content: center;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">☁ Weather<span>ly</span></div>
    <button class="location-btn" onclick="getLocation()">
        📍 My Location
    </button>
</header>

<h1>Discover the Weather</h1>
<p class="subtitle">
    Get accurate weather updates wherever you are.
</p>

<div class="search-box">
    <input type="text" id="cityInput"
        placeholder="Enter city name...">
    <button onclick="searchWeather()">Search</button>
</div>

<p class="message" id="message">
    Search for a city to see its weather.
</p>

<div class="weather-card" id="weatherCard">

    <div class="weather-main">

        <div>
            <p class="city" id="cityName">City</p>
            <p id="date"></p>

            <div class="temperature" id="temperature">--°C</div>

            <p class="description" id="description">
                Weather condition
            </p>
        </div>

        <div class="weather-icon" id="weatherIcon">🌤️</div>

    </div>

    <div class="details">

        <div class="detail-box">
            <h3>💧 Humidity</h3>
            <p id="humidity">--%</p>
        </div>

        <div class="detail-box">
            <h3>🌬️ Wind Speed</h3>
            <p id="wind">-- km/h</p>
        </div>

        <div class="detail-box">
            <h3>🌡️ Feels Like</h3>
            <p id="feels">--°C</p>
        </div>

    </div>

    <h2 class="forecast-title">5-Day Forecast</h2>

    <div class="forecast" id="forecast"></div>

</div>

<footer>
    © 2026 Weatherly | Designed with ❤️
</footer>

</div>

<script>

const weatherTypes = {
    0: ["Clear Sky", "☀️"],
    1: ["Mainly Clear", "🌤️"],
    2: ["Partly Cloudy", "⛅"],
    3: ["Cloudy", "☁️"],
    45: ["Foggy", "🌫️"],
    48: ["Foggy", "🌫️"],
    51: ["Light Drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy Drizzle", "🌧️"],
    61: ["Light Rain", "🌧️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy Rain", "🌧️"],
    71: ["Light Snow", "🌨️"],
    73: ["Snow", "❄️"],
    75: ["Heavy Snow", "❄️"],
    80: ["Rain Showers", "🌦️"],
    81: ["Rain Showers", "🌧️"],
    82: ["Heavy Showers", "⛈️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"]
};

function getWeatherInfo(code) {
    return weatherTypes[code] || ["Unknown", "🌤️"];
}

async function searchWeather() {

    const city = document.getElementById("cityInput").value.trim();

    if (!city) {
        showMessage("Please enter a city name.");
        return;
    }

    try {
        showMessage("Searching weather...");

        const url =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
            showMessage("City not found. Please try again.");
            return;
        }

        const place = data.results[0];

        await getWeather(
            place.latitude,
            place.longitude,
            place.name,
            place.country || ""
        );

    } catch (error) {
        showMessage("Unable to load weather. Check your internet connection.");
    }
}

async function getWeather(lat, lon, city, country) {

    try {

        showMessage("Loading weather...");

        const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok || !data.current) {
            throw new Error("Weather data unavailable");
        }

        const current = data.current;
        const info = getWeatherInfo(current.weather_code);

        document.getElementById("cityName").textContent =
            city + (country ? ", " + country : "");

        document.getElementById("date").textContent =
            new Date().toDateString();

        document.getElementById("temperature").textContent =
            Math.round(current.temperature_2m) + "°C";

        document.getElementById("description").textContent =
            info[0];

        document.getElementById("weatherIcon").textContent =
            info[1];

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m + "%";

        document.getElementById("wind").textContent =
            current.wind_speed_10m + " km/h";

        document.getElementById("feels").textContent =
            Math.round(current.apparent_temperature) + "°C";

        displayForecast(data.daily);

        document.getElementById("weatherCard").style.display = "block";

        showMessage("");

    } catch (error) {
        showMessage("Could not load weather data. Please try again.");
    }
}

function displayForecast(daily) {

    const forecast = document.getElementById("forecast");
    forecast.innerHTML = "";

    daily.time.forEach((day, index) => {

        const info = getWeatherInfo(daily.weather_code[index]);

        const date = new Date(day + "T12:00:00");

        const dayName = date.toLocaleDateString("en-US", {
            weekday: "short"
        });

        const card = document.createElement("div");
        card.className = "forecast-day";

        const dayLabel = document.createElement("p");
        dayLabel.textContent = dayName;

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = info[1];

        const condition = document.createElement("p");
        condition.textContent = info[0];

        const max = document.createElement("p");
        max.textContent = "High: " +
            Math.round(daily.temperature_2m_max[index]) + "°";

        const min = document.createElement("p");
        min.textContent = "Low: " +
            Math.round(daily.temperature_2m_min[index]) + "°";

        card.append(dayLabel, icon, condition, max, min);
        forecast.appendChild(card);
    });
}

function getLocation() {

    if (!navigator.geolocation) {
        showMessage("Geolocation is not supported.");
        return;
    }

    showMessage("Getting your location...");

    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                const url =
                `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=en&format=json`;

                const response = await fetch(url);
                const data = await response.json();

                const place = data.results?.[0];

                await getWeather(
                    lat,
                    lon,
                    place?.name || "Your Location",
                    place?.country || ""
                );

            } catch (error) {
                await getWeather(lat, lon, "Your Location", "");
            }
        },

        () => showMessage("Location permission denied or unavailable.")
    );
}

function showMessage(text) {
    document.getElementById("message").textContent = text;
}

document.getElementById("cityInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        searchWeather();
    }
});

</script>

</body>
</html>
